# What M3allema may do. Unlike the .md files, this is enforced in code.
# Modes: auto (runs on its own), ask (waits for your approval), deny (never runs).

defaults:
  read: auto        # looking at files, sheets, web pages
  write: ask        # creating or changing files in files/
  external: ask     # sending, paying, deleting, anything outside your control

# Per-tool overrides. Shell-style patterns; the first match wins.
tools:
  # Memory and skills outlive the conversation, so new ones always need your yes,
  # even when write is auto. This stops a web page or email from planting rules.
  "memory__*": ask
  "skills__save_skill": ask
#  "files__write_file": auto
#  "shell__*": deny

budget:
  per_run_usd: 1.00
  per_day_usd: 10.00
